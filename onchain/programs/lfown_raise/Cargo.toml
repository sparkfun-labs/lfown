[package]
name = "lfown_raise"
version = "0.1.0"
description = "A fixed-supply USDC raise: everyone in at one price, oversubscription refunded pro rata"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lfown_raise"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
