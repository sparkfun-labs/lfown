<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coins — LFOwn</title>
<meta name="description" content="Memecoins launched on LFOwn, each paired with a MetaDAO ownership coin." />

<!-- Shared links. The worker rewrites these per coin under /coins/<mint>; every
     other page keeps the banner, so a link to the site looks like the site. -->
<meta property="og:site_name" content="LFOwn" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://letsfuckingown.fun/coins" />
<meta property="og:title" content="Ownership memes — LFOwn" />
<meta property="og:description" content="Memecoins launched on LFOwn, each paired with a MetaDAO ownership coin." />
<meta property="og:image" content="https://letsfuckingown.fun/assets/og-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@LFOWNDOTFUN" />
<meta name="twitter:title" content="Ownership memes — LFOwn" />
<meta name="twitter:description" content="Memecoins launched on LFOwn, each paired with a MetaDAO ownership coin." />
<meta name="twitter:image" content="https://letsfuckingown.fun/assets/og-card.png" />
<link rel="icon" href="/favicon.png" sizes="32x32">
<link rel="icon" href="/assets/icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Martian+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Permanent+Marker&display=swap" rel="stylesheet">
<script>
(function(){
  var saved=null; try{saved=localStorage.getItem('lfown-theme')}catch(e){}
  var dark = saved ? saved==='dark'
                   : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
})();
</script>
<link rel="stylesheet" href="/assets/lfown.css">
<style>
main{padding-top:clamp(30px,5vw,54px);padding-bottom:clamp(60px,9vw,120px)}
h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.04em;
   font-size:clamp(2rem,5.4vw,3.6rem);line-height:.92;margin:0 0 10px}
.lede{color:var(--ink-soft);max-width:56ch;margin:0 0 clamp(26px,4vw,44px);font-size:1.05rem}
.skel{color:var(--ink-soft);font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}

/* ── the grid ──────────────────────── */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1.5px solid var(--ink);margin:0 0 clamp(20px,3vw,30px)}
.totals .tot{padding:16px 18px;border-right:1.5px solid var(--ink)}
.totals .tot:last-child{border-right:0}
@media(max-width:640px){.totals .tot{border-right:0;border-bottom:1.5px solid var(--ink)}.totals .tot:last-child{border-bottom:0}}
.totals .lab{display:block;font-family:var(--mono);font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.totals .big{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.earned{border-top:1px dashed var(--rule);padding-top:8px;color:var(--red)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:clamp(14px,2vw,20px)}
.coin-section + .coin-section{margin-top:clamp(34px,5vw,54px)}
.section-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-bottom:12px;margin-bottom:clamp(16px,2.4vw,22px);border-bottom:1.5px solid var(--ink)}
.section-head h2{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
  font-weight:600;margin:0;display:flex;align-items:center;gap:9px}
.section-head .count{background:var(--red);color:#fff;font-size:.58rem;letter-spacing:.1em;padding:3px 7px}
.section-head p{margin:0;font-size:.92rem;color:var(--ink-soft)}
.coin{
  border:1.5px solid var(--ink);background:var(--card);padding:18px;display:flex;flex-direction:column;gap:14px;
  text-decoration:none;color:inherit;transition:transform .16s ease,box-shadow .16s ease
}
.coin:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--red)}
.coin .top{display:flex;align-items:center;gap:12px}
.coin img{width:42px;height:42px;object-fit:cover;border:1.5px solid var(--ink);background:var(--paper)}
.coin .nm{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1}
.coin .pair{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:5px}
/* Named for what it is: `.bar` collided with the header's own bar and squashed it. */
.progress{height:8px;border:1.5px solid var(--ink);background:var(--paper);position:relative;overflow:hidden}
.progress i{display:block;height:100%;background:var(--red)}
.meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.badge{border:1.5px solid var(--red);color:var(--red);padding:3px 7px;font-family:var(--mono);font-size:.52rem;letter-spacing:.12em;text-transform:uppercase}

/* ── detail ────────────────────────── */
.back{display:inline-block;margin-bottom:22px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none}
.back:hover{color:var(--red)}
.detail{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(22px,3vw,38px);align-items:start}
@media(max-width:900px){.detail{grid-template-columns:1fr}}
.panel{border:1.5px solid var(--ink);background:var(--card);padding:clamp(20px,2.6vw,28px)}
.panel.accent{box-shadow:10px 10px 0 var(--red)}
.coin-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.coin-head img{width:64px;height:64px;object-fit:cover;border:1.5px solid var(--ink)}
.coin-head h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(1.5rem,3.4vw,2.3rem);margin:0;line-height:1}
dl.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:20px 0 0}
dl.stats dt{font-family:var(--mono);font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
dl.stats dd{margin:3px 0 0;font-size:1.02rem;font-variant-numeric:tabular-nums}
.addr{font-family:var(--mono);font-size:.56rem;letter-spacing:.04em;word-break:break-all;color:var(--ink-soft);margin-top:18px;line-height:1.6}

.chart{margin-top:clamp(22px,3vw,38px)}
.chart .lab{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin:0 0 16px;padding-bottom:14px;border-bottom:1px dashed var(--rule)}
.chart .lab b{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;color:var(--ink);text-transform:none}
.chart .now{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart .now .usd{font-family:var(--serif);font-size:.95rem;letter-spacing:0;text-transform:none;color:var(--ink-soft)}
.chart .lab .up,.chart .lab .down{color:var(--red)}
.chart .ranges{display:flex;border:1.5px solid var(--ink);margin-left:auto}
.chart .ranges button{padding:5px 12px;background:transparent;border:0;border-right:1.5px solid var(--ink);cursor:pointer;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.chart .ranges button:last-child{border-right:0}
.chart .ranges button[aria-pressed="true"]{background:var(--red);color:#fff}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4}
.chart .line{fill:none;stroke:var(--red);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--red);opacity:.1}
.chart .dot{fill:var(--red)}
.chart .cross line{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3;opacity:.5}
.chart .cross circle{fill:var(--paper);stroke:var(--red);stroke-width:2}
.chart .hit{cursor:crosshair}
.chart .now .move{font-variant-numeric:tabular-nums}
.chart .tick{font-family:var(--mono);font-size:9px;fill:var(--ink-soft)}
@media (max-width:640px){.chart .lab b{font-size:1.15rem}}
.chart .empty{font-size:.92rem;color:var(--ink-soft);margin:0}
.creator-box{border-top:1px dashed var(--rule);margin-top:20px;padding-top:18px}
.creator-box .lab{font-family:var(--mono);font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:8px}
.fee-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px 16px;margin:0 0 16px}
.fee-split dt{font-family:var(--mono);font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.fee-split dd{margin:3px 0 0;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em}

.creator-box .amount{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin-bottom:14px}
.creator-box .amount .sub{font-family:var(--serif);font-weight:400;font-size:.95rem;color:var(--ink-soft);letter-spacing:0;margin-left:8px}
.phase{border-top:1px dashed var(--rule);padding-top:14px;margin-top:14px}
.phase:first-of-type{border-top:0;padding-top:0;margin-top:0}
.creator-box .claimed{font-size:.95rem;color:var(--ink-soft);margin:-6px 0 14px;font-variant-numeric:tabular-nums}
.creator-box .claimed .sub{margin-left:6px;opacity:.75}
.creator-box .btn{width:auto}
.creator-box .hint{font-size:.85rem;color:var(--ink-soft);margin:10px 0 0}

.tabs{display:flex;border:1.5px solid var(--ink);margin-bottom:18px}
.tabs button{flex:1;padding:11px;background:transparent;border:0;border-right:1.5px solid var(--ink);cursor:pointer;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--red);color:#fff}
.pay{display:flex;border:1.5px solid var(--ink);flex-wrap:wrap}
.pay button{flex:1 1 0;min-width:80px;padding:10px 8px;background:transparent;border:0;border-right:1.5px solid var(--ink);cursor:pointer;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.pay button:last-child{border-right:0}
.pay button[aria-pressed="true"]{background:var(--red);color:#fff}
.pay button:disabled{opacity:.45;cursor:not-allowed}
.trade .pay{margin-bottom:14px}
.trade .payline{font-size:.85rem;color:var(--ink-soft);margin:-6px 0 14px;font-variant-numeric:tabular-nums}
.trade .payline b{color:var(--ink);font-weight:500}
.trade label{display:block;margin-bottom:14px}
.trade .lab{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:7px}
.trade input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);padding:11px 13px}
.trade input:focus{outline:2px solid var(--red);outline-offset:-1px}
.quote{border-top:1px dashed var(--rule);padding-top:14px;margin-top:4px;font-size:.95rem;color:var(--ink-soft);min-height:44px}
.quote b{color:var(--ink);font-weight:500}
button.btn{font:inherit;cursor:pointer;font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;width:100%;justify-content:center}
button.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:5px 5px 0 var(--ink)}
/* The status line is empty most of the time; reserving its height keeps the panel
   from growing under the cursor the moment a trade confirms. */
#trade-status{min-height:1.4em}
.jup{display:block;margin-top:12px;text-align:center;text-decoration:none}
.quote a, .trade .hint a{color:var(--red)}
.warn-text{color:var(--red)}
.wallet-slot{position:relative;display:inline-flex}
.wallet-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:60;min-width:230px;border:1.5px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--red)}
.wallet-addr{padding:11px 14px;border-bottom:1px dashed var(--rule);word-break:break-all;font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;color:var(--ink-soft);line-height:1.5}
.wallet-menu button{display:block;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;padding:11px 14px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);transition:background .15s,color .15s}
.wallet-menu button:hover{background:var(--red);color:#fff}
.wallet-menu button+button{border-top:1px dashed var(--rule)}
dialog#wallet-picker{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:0;max-width:340px;width:calc(100% - 40px);box-shadow:12px 12px 0 var(--red)}
dialog#wallet-picker::backdrop{background:rgba(0,0,0,.45)}
.picker-head{background:var(--red);color:#fff;padding:12px 18px;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.picker-list{list-style:none;margin:0;padding:0}
.picker-list li+li{border-top:1px dashed var(--rule)}
.picker-list button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;background:transparent;border:0;font:inherit;font-size:1rem;color:inherit;cursor:pointer;text-align:left;transition:background .15s}
.picker-list button:hover{background:var(--red);color:#fff}
.picker-list img{width:24px;height:24px;border-radius:4px}
.picker-list .blank{width:24px;height:24px;border:1.5px solid currentColor;opacity:.4}
#picker-close{margin:14px 18px 18px;cursor:pointer;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;width:auto}
</style>
</head>
<body>

<header class="top">
  <div class="bar">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/logo-mark.png" alt="LFOwn"></a>
    <nav class="nav-centre">
      <a class="mono hide-s" href="/coins" aria-current="page">Coins</a>
      <a class="mono hide-s" href="/launch">Launch</a>
    </nav>
    <nav class="nav-actions">
      <button class="theme-toggle hide-s" type="button" id="themeToggle" aria-label="Switch colour theme">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
      </button>
      <span class="wallet-slot">
        <button class="btn" type="button" id="connect">Connect wallet</button>
        <div class="wallet-menu" id="wallet-menu" hidden>
          <div class="wallet-addr" id="wallet-addr"></div>
          <button type="button" data-act="copy">Copy address</button>
          <button type="button" data-act="disconnect">Disconnect</button>
        </div>
      </span>
      <button class="burger" type="button" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </div>

</header>

<!-- Outside the header on purpose. `header.top` carries a backdrop-filter, and a
     filter makes an element the containing block for any position:fixed descendant
     — the drawer inherited the header's 68 pixels of height and stopped there. -->
<div class="scrim" id="menuScrim" hidden></div>
<aside class="drawer" id="menu" hidden aria-label="Menu">
    <div class="drawer-head">
      <span class="mono">Menu</span>
      <button class="drawer-close" type="button" id="menuClose" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <nav class="drawer-nav">
      <a href="/coins">Coins</a>
      <a href="/launch">Launch</a>
    </nav>
    <button class="theme-toggle drawer-theme" type="button" aria-label="Switch colour theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
      <span class="mono">Theme</span>
    </button>
    <a class="drawer-x" href="https://x.com/LFOWNDOTFUN" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      <span class="mono">@LFOWNDOTFUN</span>
    </a>
  </aside>

<script>
  // The theme lives here rather than in each page's bundle: there are two toggles
  // now, one in the bar and one in the drawer, and the landing ships no bundle at all.
  (function () {
    var root = document.documentElement
    var toggles = document.querySelectorAll('.theme-toggle')
    function label(theme) {
      for (var i = 0; i < toggles.length; i++) {
        toggles[i].setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme')
      }
    }
    label(root.getAttribute('data-theme'))
    function flip() {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
      root.setAttribute('data-theme', next)
      try { localStorage.setItem('lfown-theme', next) } catch (e) {}
      label(next)
      // The landing listens for this to repaint its embedded tweet, which carries
      // its own theme baked into the markup.
      document.dispatchEvent(new CustomEvent('lfown:theme', { detail: next }))
    }
    for (var i = 0; i < toggles.length; i++) toggles[i].addEventListener('click', flip)

    var burger = document.getElementById('menuToggle')
    var drawer = document.getElementById('menu')
    var scrim = document.getElementById('menuScrim')
    function show(on) {
      drawer.hidden = !on
      scrim.hidden = !on
      burger.setAttribute('aria-expanded', String(on))
      // The page behind must not scroll under the drawer.
      document.body.classList.toggle('menu-open', on)
    }
    burger.addEventListener('click', function () { show(drawer.hidden) })
    scrim.addEventListener('click', function () { show(false) })
    document.getElementById('menuClose').addEventListener('click', function () { show(false) })
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') show(false) })
    // Rotating a phone, or dragging a window past the breakpoint, hides the drawer
    // by CSS — but the scroll lock behind it would survive, leaving the page frozen
    // with nothing on screen to explain it or undo it.
    var wide = window.matchMedia('(min-width: 861px)')
    var onWide = function (e) { if (e.matches) show(false) }
    if (wide.addEventListener) wide.addEventListener('change', onWide)
    else if (wide.addListener) wide.addListener(onWide)

    // Coins links are handled by the router without a page load, so the drawer would
    // otherwise still be sitting open over the page it just navigated to.
    var links = drawer.querySelectorAll('a')
    for (var j = 0; j < links.length; j++) links[j].addEventListener('click', function () { show(false) })
  })()
</script>
<!--/lfown-header-->

<main class="wrap" id="view"><p class="skel">Loading coins…</p></main>

<dialog id="wallet-picker">
  <div class="picker-head">Choose a wallet</div>
  <ul class="picker-list" id="wallet-list"></ul>
  <button class="btn ghost" type="button" id="picker-close">Cancel</button>
</dialog>

<script type="module" src="/app/coins.js"></script>
</body>
</html>
