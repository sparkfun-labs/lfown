<link rel="stylesheet" href="/assets/lfown.css">
<style>
main{padding-top:clamp(26px,4vw,46px);padding-bottom:clamp(60px,9vw,120px)}
h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.04em;font-size:clamp(2rem,5.4vw,3.6rem);line-height:.9;margin:0 0 10px;word-break:break-word}
h1 em{font-style:normal;color:var(--red)}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(1.2rem,2.4vw,1.6rem);line-height:1;margin:0 0 14px}
.lede{color:var(--ink-soft);max-width:62ch;margin:0 0 clamp(20px,3vw,30px);font-size:1.02rem}
.lede b{color:var(--ink);font-weight:500}
.skel{color:var(--ink-soft);font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
.lab{display:block;font-family:var(--mono);font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.back{display:inline-block;margin-bottom:18px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none}
.back:hover{color:var(--red)}
.net{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--red);background:var(--card);padding:10px 14px;margin:0 0 clamp(20px,3vw,30px);font-size:.9rem}
.net b{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.net a{color:var(--red)}
.net .btn{margin-left:auto}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1.5px solid var(--ink);background:var(--card);margin:0 0 clamp(22px,3.2vw,34px)}
.totals .tot{padding:14px 16px;border-right:1.5px solid var(--ink)}
.totals .tot:last-child{border-right:0}
@media(max-width:640px){.totals .tot{border-right:0;border-bottom:1.5px solid var(--ink)}.totals .tot:last-child{border-bottom:0}}
.totals .big{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;line-height:1.05}
.totals .sub{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:5px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(18px,3vw,34px);align-items:start;margin-bottom:clamp(28px,4vw,44px)}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{border:1.5px solid var(--ink);background:var(--card);padding:clamp(16px,2.2vw,22px);display:grid;gap:12px}
.card.hot{box-shadow:7px 7px 0 var(--red)}
.card p{margin:0;color:var(--ink-soft);font-size:.93rem}
.card label{display:grid;gap:6px}
.card input,.card select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);padding:10px 12px}
.card input:focus,.card select:focus{outline:2px solid var(--red);outline-offset:-1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.85rem;color:var(--ink-soft);margin:0}
.hint.warn{color:var(--red)}
.hint b{color:var(--ink);font-weight:500}
.progress{height:10px;border:1.5px solid var(--ink);background:var(--paper);overflow:hidden}
.progress i{display:block;height:100%;background:var(--red)}
.badge{display:inline-block;font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border:1.5px solid var(--ink);vertical-align:middle}
.badge.live{background:var(--red);border-color:var(--red);color:#fff}
.badge.won{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:clamp(14px,2vw,20px)}
.raise{border:1.5px solid var(--ink);background:var(--card);padding:16px;display:grid;gap:12px;text-decoration:none;color:inherit;transition:transform .16s ease,box-shadow .16s ease}
.raise:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--red)}
.raise .nm{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1}
.raise .pair{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:5px}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:10px;margin:0 0 16px;border-bottom:1.5px solid var(--ink)}
.sec-head h2{margin:0}
.terms{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.93rem}
.terms li{display:flex;justify-content:space-between;gap:14px;border-bottom:1px dashed var(--rule);padding-bottom:7px}
.terms li span:first-child{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.proposal{border:1.5px solid var(--ink);background:var(--card);padding:16px;display:grid;gap:12px;margin-bottom:14px}
.addr{font-family:var(--mono);font-size:.78em;word-break:break-all}
.proposal .title{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--rule);padding:10px 12px;display:grid;gap:4px}
.opt.lead{border-color:var(--red)}
.opt .price{font-family:var(--display);font-weight:800;font-size:1.1rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions input{max-width:160px}
.status{font-size:.86rem;min-height:1.2em}
.status.warn{color:var(--red)}
.empty{color:var(--ink-soft);font-size:.95rem;border:1.5px dashed var(--rule);padding:18px}

/* ── Raise ↔ DAO, and a decision laid out like MetaDAO's ─────────────────── */
:root{--pass:#0E9F5A;--fail:var(--red)}
:root[data-theme="dark"]{--pass:#2BD17E}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.crumbs a{color:var(--ink-soft);text-decoration:none}
.crumbs a:hover{color:var(--red)}
.crumbs span{color:var(--ink)}
.crumbs i{font-style:normal;opacity:.5}
.head-row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.head-row h1{margin-bottom:10px}
.jump{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--ink);border:1.5px solid var(--ink);padding:10px 14px;background:var(--card);transition:transform .16s,box-shadow .16s}
.jump:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--red)}
.jump.hot{background:var(--red);border-color:var(--red);color:#fff}
.jump.hot:hover{box-shadow:5px 5px 0 var(--ink)}
.dao-banner{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;border:1.5px solid var(--ink);background:var(--card);padding:18px;text-decoration:none;color:inherit;box-shadow:7px 7px 0 var(--red)}
.dao-banner .lab{grid-column:1}
.dao-banner b{grid-column:1;font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-.02em;line-height:1.1}
.dao-banner .jump{grid-column:2;grid-row:1/3}
@media(max-width:640px){.dao-banner{grid-template-columns:1fr}.dao-banner .jump{grid-column:1;grid-row:auto;justify-self:start}}
.side{display:grid;gap:clamp(18px,3vw,26px)}
.tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;border:1.5px solid var(--ink);padding:4px 8px;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;padding:4px 10px;background:var(--glow);color:var(--ink);border-radius:99px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1.4s ease-in-out infinite}
.pill .dot{margin-right:0}
@keyframes blink{50%{opacity:.35}}
.pass{color:var(--pass)}.fail{color:var(--fail)}
.decision-row{display:grid;gap:10px;border:1.5px solid var(--ink);background:var(--card);padding:16px;margin-bottom:14px;text-decoration:none;color:inherit;transition:transform .16s,box-shadow .16s}
.decision-row:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--red)}
.decision-row .title{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;line-height:1.1}
.decision-row .meta{align-items:center}
.decision{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr);gap:clamp(20px,3.4vw,40px);align-items:start}
@media(max-width:900px){.decision{grid-template-columns:1fr}}
.head-meta{justify-content:flex-start;gap:10px;align-items:center;margin-bottom:14px}
.decision-title{text-transform:none;letter-spacing:-.03em;font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.02;margin-bottom:22px}
.chart{position:relative;border:1.5px solid var(--ink);background:var(--card);padding:14px 10px 6px}
.chart svg{display:block;width:100%;height:clamp(200px,28vw,280px)}
.chart .legend{display:flex;gap:16px;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px 4px}
.chart .legend span::before{content:"";display:inline-block;width:14px;height:2px;background:currentColor;vertical-align:middle;margin-right:6px}
.chart .grid-line{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.chart .axis{fill:var(--ink-soft);font-family:var(--mono);font-size:10px}
.chart .line{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.chart .line.pass{stroke:var(--pass)}.chart .line.fail{stroke:var(--fail)}
/* Fail underneath and wider: where the two lines meet, it still shows either side of Pass. */
.chart .line.under{stroke-width:5}
.chart .pass-dot{fill:var(--pass)}.chart .fail-dot{fill:var(--fail)}
.empty-chart{display:grid;place-items:center;min-height:200px;color:var(--ink-soft);font-size:.9rem;text-align:center}
.twap{margin:22px 0 26px;display:grid;gap:10px}
.twap-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.twap-head h2{margin:0}
.twap-head div{display:flex;gap:18px;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em}
.twap-head .lead{font-weight:600;text-decoration:underline;text-underline-offset:4px}
.twap-bar{height:12px;background:var(--fail);border:1.5px solid var(--ink)}
.twap-bar i{display:block;height:100%;background:var(--pass);border-right:2px solid var(--card)}
.tabs{display:flex;border-bottom:1.5px solid var(--rule);margin-bottom:18px}
.tabs button{flex:1;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;background:none;border:0;border-bottom:2.5px solid transparent;color:var(--ink-soft);padding:12px 6px;margin-bottom:-1.5px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.tab-body{display:grid;gap:12px;font-size:.98rem}
.tab-body h3{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0}
.tab-body p{margin:0;color:var(--ink-soft)}
.steps{margin:0;padding-left:20px;display:grid;gap:8px}
.trades{width:100%;border-collapse:collapse;font-size:.86rem}
.trades th{font-family:var(--mono);font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-align:left;font-weight:400;padding:0 8px 8px 0;border-bottom:1.5px solid var(--ink)}
.trades td{padding:9px 8px 9px 0;border-bottom:1px dashed var(--rule)}
.panel{position:sticky;top:92px}
@media(max-width:900px){.panel{position:static}}
.panel{min-width:0}
.panel-box{border:1.5px solid var(--ink);background:var(--card);padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;box-shadow:7px 7px 0 var(--red)}
.panel-box .lab{margin:6px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink)}
.seg button{min-width:0;font:inherit;font-size:.86rem;background:var(--card);color:var(--ink);border:0;padding:12px 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.pass-sq,.fail-sq{display:inline-block;width:9px;height:9px}
.pass-sq{background:var(--pass)}.fail-sq{background:var(--fail)}
.spend{display:flex;align-items:center;border:1.5px solid var(--ink);background:var(--paper);padding:6px 12px}
.spend input{flex:1;width:100%;min-width:0;border:0;background:none;font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--ink);padding:8px 0;outline:none}
.spend span{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.recv{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule);padding:12px 0;font-size:.9rem}
.recv b{font-weight:500;text-align:right}
.btn.wide{width:100%;justify-content:center}
.link{background:none;border:0;padding:0;font:inherit;color:var(--red);cursor:pointer;text-decoration:underline}
.result{font-family:var(--display);font-weight:800;font-size:2.2rem;text-transform:uppercase;letter-spacing:-.03em}
</style>

<script>
  // Fair launches' tabs, shown only where fair launches exist: a test cluster, until
  // their programs are audited. Production answers 404 and they stay hidden. Asked
  // once per visit.
  (function () {
    var tabs = document.querySelectorAll('[data-fair]')
    if (!tabs.length || !window.fetch) return
    var show = function () { for (var i = 0; i < tabs.length; i++) tabs[i].hidden = false }
    var known = null
    try { known = sessionStorage.getItem('lfown-fair') } catch (e) {}
    if (known === '1') return show()
    if (known === '0') return
    fetch('/api/fair/config').then(function (r) {
      try { sessionStorage.setItem('lfown-fair', r.ok ? '1' : '0') } catch (e) {}
      if (r.ok) show()
    }).catch(function () {})
  })()
</script>
<script>
  // The theme lives here rather than in each page's bundle: there are two toggles
  // now, one in the bar and one in the drawer, and the landing ships no bundle at all.
  (function () {
    var root = document.documentElement
    var toggles = document.querySelectorAll('.theme-toggle')
    function label(theme) {
      for (var i = 0; i < toggles.length; i++) {
        toggles[i].setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme')
      }
    }
    label(root.getAttribute('data-theme'))
    function flip() {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
      root.setAttribute('data-theme', next)
      try { localStorage.setItem('lfown-theme', next) } catch (e) {}
      label(next)
      // The landing listens for this to repaint its embedded tweet, which carries
      // its own theme baked into the markup.
      document.dispatchEvent(new CustomEvent('lfown:theme', { detail: next }))
    }
    for (var i = 0; i < toggles.length; i++) toggles[i].addEventListener('click', flip)

    var burger = document.getElementById('menuToggle')
    var drawer = document.getElementById('menu')
    var scrim = document.getElementById('menuScrim')
    function show(on) {
      drawer.hidden = !on
      scrim.hidden = !on
      burger.setAttribute('aria-expanded', String(on))
      // The page behind must not scroll under the drawer.
      document.body.classList.toggle('menu-open', on)
    }
    burger.addEventListener('click', function () { show(drawer.hidden) })
    scrim.addEventListener('click', function () { show(false) })
    document.getElementById('menuClose').addEventListener('click', function () { show(false) })
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') show(false) })
    // Rotating a phone, or dragging a window past the breakpoint, hides the drawer
    // by CSS — but the scroll lock behind it would survive, leaving the page frozen
    // with nothing on screen to explain it or undo it.
    var wide = window.matchMedia('(min-width: 861px)')
    var onWide = function (e) { if (e.matches) show(false) }
    if (wide.addEventListener) wide.addEventListener('change', onWide)
    else if (wide.addListener) wide.addListener(onWide)

    // Coins links are handled by the router without a page load, so the drawer would
    // otherwise still be sitting open over the page it just navigated to.
    var links = drawer.querySelectorAll('a')
    for (var j = 0; j < links.length; j++) links[j].addEventListener('click', function () { show(false) })
  })()
</script>
<script>
  // The earners strip. Per wallet, the creator's own share of every coin it launched, in
  // dollars — the figure /leaderboard ranks by. Wallets under a dollar are left out.
  (function () {
    var box = document.getElementById('earners')
    var track = document.getElementById('earnersTrack')
    if (!box || !track || !window.fetch) return
    fetch('/api/fees').then(function (r) { return r.json() }).then(function (report) {
      var by = {}
      var coins = (report && report.coins) || []
      for (var i = 0; i < coins.length; i++) {
        var c = coins[i]
        if (!c.creatorWallet) continue
        by[c.creatorWallet] = (by[c.creatorWallet] || 0) + (Number(c.creator) || 0) * (Number(c.quoteUsdPrice) || 0)
      }
      var rows = Object.keys(by).map(function (w) { return { w: w, usd: by[w] } })
        .filter(function (r) { return r.usd >= 1 })
        .sort(function (a, b) { return b.usd - a.usd })
        .slice(0, 30)
      if (!rows.length) return
      var item = function (r) {
        // Addresses are base58, so they need no escaping; the check keeps it that way.
        if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(r.w)) return ''
        return '<a class="earner" href="/creator/' + r.w + '"><span class="dot"></span>' +
          '<b>' + r.w.slice(0, 4) + '…' + r.w.slice(-4) + '</b> earned <em>$' +
          Math.round(r.usd).toLocaleString('en-US') + '</em> in fees</a>'
      }
      // Repeated until one copy is wider than any screen, then doubled: the strip slides
      // by exactly half its width and loops without a seam.
      var one = rows.map(item).join('')
      var group = one
      while (group.length < 6000 && rows.length) group += one
      track.innerHTML = '<div class="earners-grp">' + group + '</div><div class="earners-grp" aria-hidden="true">' + group + '</div>'
      track.style.animationDuration = Math.max(30, rows.length * 9) + 's'
      box.hidden = false
    }).catch(function () { /* no strip is better than a broken one */ })
  })()
</script>
